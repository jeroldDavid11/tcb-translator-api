# enable serverless adapter in Lambda
spring.main.web-application-type=servlet
spring.cloud.function.serverless.enabled=true

# keep actuator minimal in Lambda
management.endpoints.web.exposure.include=health,info

# Enable Serverless container (so Lambda proxy works)
# DO NOT exclude ServerlessAutoConfiguration here
spring.main.banner-mode=off

# Logging optimized for Lambda
logging.level.root=INFO
logging.level.com.tcb=INFO
