# disable serverless auto-config when running locally
spring.cloud.function.serverless.enabled=false
spring.main.web-application-type=reactive

# Disable Lambda auto-configuration to avoid Serverless container startup
spring.autoconfigure.exclude=org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration

# Normal local server port
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.tcb=DEBUG

# Optional health/info actuator
management.endpoints.web.exposure.include=health,info
